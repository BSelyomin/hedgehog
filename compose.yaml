services:
  database:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: hedgehog
      POSTGRES_USER: hedgehog
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hedgehog -d hedgehog"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      target: server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://hedgehog:local-development-only@database:5432/hedgehog}
      SNOWFLAKE_ACCOUNT_URL: ${SNOWFLAKE_ACCOUNT_URL:-}
      SNOWFLAKE_PAT: ${SNOWFLAKE_PAT:-}
      SNOWFLAKE_CORTEX_MODEL: ${SNOWFLAKE_CORTEX_MODEL:-}
      SNOWFLAKE_SEARCH_DATABASE: ${SNOWFLAKE_SEARCH_DATABASE:-}
      SNOWFLAKE_SEARCH_SCHEMA: ${SNOWFLAKE_SEARCH_SCHEMA:-}
      SNOWFLAKE_SEARCH_SERVICE: ${SNOWFLAKE_SEARCH_SERVICE:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      SNAPTRADE_CLIENT_ID: ${SNAPTRADE_CLIENT_ID:-}
      SNAPTRADE_CONSUMER_KEY: ${SNAPTRADE_CONSUMER_KEY:-}
      SNAPTRADE_ENCRYPTION_KEY: ${SNAPTRADE_ENCRYPTION_KEY:-}
      SNAPTRADE_MODE: ${SNAPTRADE_MODE:-sandbox}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      TRACK_HISTORY_ENABLED: ${TRACK_HISTORY_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build:
      context: .
      target: web
    environment:
      API_INTERNAL_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database_data:
